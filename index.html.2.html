<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Culture of Humanity</title>
<meta name="description" content="A living atlas of culture, one story at a time." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* ═══════════════════════════════════════════════════════
   Culture of Humanity · Production Grade Styles
   ═══════════════════════════════════════════════════════ */
:root{
  --paper:#fbf8f1;
  --paper-2:#f2ebd9;
  --card:#ffffff;
  --ink:#2c2a26;
  --ink-2:#545049;
  --ink-3:#8c857a;
  --ink-4:#b8b2a6;
  --mint:#397c5d;
  --mint-2:#5aab81;
  --mint-3:#224d39;
  --mint-bg:#e3f0e9;
  --red:#c45a4d;
  --line:#eae2d1;
  --line-2:#f4efe5;
  --hand:'Caveat', cursive;
  --round:'Quicksand', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{ font-family:var(--round); font-size:15px; line-height:1.6; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden; }
button{font-family:inherit;background:none;border:none;cursor:pointer;color:inherit;padding:0; transition: all 0.2s ease;}
a{color:inherit;text-decoration:none;cursor:pointer}
input,textarea,select{font-family:inherit;color:inherit}

/* ── Welcome View ──────────────────────────────────── */
#view-welcome { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: center; color: #fff; overflow: hidden; background: #000; }
#welcome-globe { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
#welcome-globe canvas { display: block; }
.welcome-overlay { position: absolute; inset: 0; z-index: 2; background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 45%, transparent 75%); pointer-events: none; }
.welcome-content { position: relative; z-index: 3; padding: 0 8vw; max-width: 800px; animation: fadeIn 1.5s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.welcome-kicker { font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase; font-weight: 600; color: var(--mint-2); margin-bottom: 24px; display: block; }
.welcome-title { font-family: var(--hand); font-weight: 600; font-size: clamp(4rem, 8vw, 7rem); line-height: 0.95; margin-bottom: 24px; color: #fff; }
.welcome-sub { font-size: clamp(1.1rem, 1.4vw, 1.3rem); line-height: 1.6; color: rgba(235, 245, 240, 0.85); max-width: 480px; margin-bottom: 48px; }
.welcome-btn { display: inline-flex; align-items: center; gap: 12px; padding: 16px 36px; border: 2px solid rgba(90,171,129,0.6); border-radius: 30px; background: rgba(57,124,93,0.2); backdrop-filter: blur(8px); font-size: 0.9rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--mint-2); transition: all 0.3s ease; cursor: pointer; pointer-events: auto; }
.welcome-btn:hover { background: var(--mint); border-color: var(--mint); color: #fff; transform: translateY(-3px); }

/* ── Navigation ─────────────────────────────────────── */
#nav { position:sticky; top:0; z-index:40; background:rgba(251,248,241,0.9); backdrop-filter: blur(12px); border-bottom: 2px dashed var(--line); height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 32px; }
.brand { font-family:var(--hand); font-weight:700; font-size:2rem; color:var(--mint-3); text-decoration:none; }
#nav-links { display:flex; gap:8px; }
.nav-link { font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase; font-weight: 600; color:var(--ink-3); padding:10px 18px; border-radius: 20px; cursor:pointer; }
.nav-link:hover { background: var(--paper-2); color:var(--ink); }
.nav-link.active { color:var(--mint-3); background: var(--mint-bg); }
#nav-auth { display:flex; gap:8px; align-items:center; }

/* ── Buttons ────────────────────────────────────────── */
.btn { font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase; font-weight:600; padding:12px 24px; border-radius: 24px; background:var(--card); color:var(--ink); border: 2px solid var(--line); display:inline-flex; align-items:center; justify-content: center; gap:8px; }
.btn:hover:not(:disabled) { border-color:var(--ink-3); transform:translateY(-2px); }
.btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
.btn.primary { background:var(--mint); color:#fff; border-color:var(--mint); }
.btn.primary:hover:not(:disabled) { background:var(--mint-2); border-color:var(--mint-2); }
.btn.ghost { background:transparent; border-color:transparent; }
.btn.small { padding:8px 16px; font-size:0.7rem; }

/* ── Feed ───────────────────────────────────────────── */
#main { padding-bottom:80px; min-height: calc(100vh - 72px); }
.feed-header { max-width:580px; margin:0 auto; padding:56px 20px 24px; text-align:center; }
.feed-header h1 { font-family:var(--hand); font-size:3.2rem; font-weight:600; color:var(--ink); line-height:1.1; margin-bottom: 12px; }
.feed-header p { color:var(--ink-3); }
.feed-divider { text-align:center; color:var(--mint-2); font-size:1rem; letter-spacing:0.5em; padding:12px 0 32px; }
.feed { max-width:580px; margin:0 auto; padding:0 20px; }
.post { background:var(--card); border-radius: 20px; border: 1px solid var(--line); margin-bottom:32px; overflow: hidden; box-shadow: 0 4px 20px rgba(44,42,38,0.02); }
.post-head { padding:16px 20px; display:flex; align-items:center; gap:14px; }
.avatar { width:42px; height:42px; border-radius:16px; display:grid; place-items:center; background:var(--mint-bg); border: 2px solid #fff; font-size:1.3rem; }
.username { font-weight:700; color:var(--ink); cursor:pointer; }
.post-place { font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; font-weight: 600; color:var(--mint); margin-left:auto; background: var(--mint-bg); padding: 6px 12px; border-radius: 20px; }
.post-scene { aspect-ratio:1; display:grid; place-items:center; font-size:6rem; cursor:pointer; }
.post-scene.warm { background:linear-gradient(135deg,#f6e3d5 0%,#e8c4b0 100%) }
.post-scene.rose { background:linear-gradient(135deg,#f6d5dc 0%,#e8b0bc 100%) }
.post-scene.sage { background:linear-gradient(135deg,#dce8d5 0%,#b0d1a8 100%) }
.post-scene.ocean { background:linear-gradient(135deg,#d5e8f6 0%,#a8cce8 100%) }
.post-scene.plum { background:linear-gradient(135deg,#e8d5f6 0%,#c8a8e8 100%) }
.post-body { padding:20px 24px 24px; }
.post-caption { font-size:1rem; line-height:1.6; color:var(--ink-2); margin-bottom:18px; }
.post-actions { display:flex; gap:16px; font-weight:600; color:var(--ink-3); }
.action-btn { display:inline-flex; align-items:center; gap:8px; padding: 8px 12px; border-radius: 16px; }
.action-btn:hover { background:var(--paper-2); color:var(--ink); }
.action-btn.liked { color:var(--red); background:rgba(196,90,77,0.1); }

/* ── Globe ──────────────────────────────────────────── */
#view-globe { position:fixed; inset:72px 0 0 0; background:#000; overflow:hidden; }
#globe-canvas { position:absolute; inset:0; cursor: crosshair; pointer-events: auto; }
#globe-pins { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.globe-pin { position:absolute; will-change:transform; }
.globe-pin-dot { position:absolute; left:-8px; top:-8px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 0 20px 6px rgba(90,171,129,0.8); pointer-events:auto; cursor:pointer; }
.globe-pin-label { position:absolute; left:20px; top:-12px; font-family: var(--hand); font-size:1.2rem; color:#fff; pointer-events:auto; cursor:pointer; white-space:nowrap; }
#globe-overlay { position:absolute; inset:24px; pointer-events:none; border:2px dashed rgba(90,171,129,0.2); border-radius: 20px; }
.globe-instruction { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 12px 24px; border-radius: 30px; color: #fff; pointer-events: none; border: 1px solid rgba(255,255,255,0.1); }

/* ── Modals ─────────────────────────────────────────── */
.modal-backdrop { position:fixed; inset:0; background:rgba(44,42,38,0.6); backdrop-filter: blur(4px); display:grid; place-items:center; z-index:100; padding:20px; }
.modal { background:var(--paper); border-radius: 24px; padding:40px; max-width:440px; width:100%; box-shadow:0 24px 64px rgba(0,0,0,0.2); position:relative; animation: modalIn 0.3s ease; }
@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.modal-close { position:absolute; top:16px; right:16px; font-size:1.5rem; color:var(--ink-3); cursor:pointer; padding: 4px; }
.modal h2 { font-family:var(--hand); font-size:2.4rem; font-weight:600; margin-bottom:8px; color:var(--mint-3); }
.modal label { display:block; font-size:0.75rem; font-weight:600; color:var(--ink-2); margin:18px 0 8px; }
.modal input, .modal textarea, .modal select { width:100%; padding:14px 16px; border:2px solid var(--line); border-radius: 16px; background:var(--card); font-size:0.95rem; }
.modal input:focus { outline: none; border-color: var(--mint-2); }
.modal-actions { display:flex; gap:12px; margin-top:32px; }
.modal-actions .btn { flex: 1; }
.modal-error { color:var(--red); font-size:0.85rem; margin-top:8px; min-height:1.2em; font-weight: 600; }

/* ── Profile & Other Views ────────────────────────────── */
.profile-head { max-width:700px; margin:0 auto; padding:64px 24px 32px; display:flex; gap:40px; align-items:center; }
.profile-info h1 { font-family:var(--hand); font-size:3rem; font-weight:600; }
.profile-bio { font-size:1.05rem; color:var(--ink-2); margin-bottom:24px; }
.profile-stats { display:flex; gap:32px; }
.profile-stats strong { display:block; font-size:1.6rem; font-weight:700; }
.post-grid { max-width:900px; margin:0 auto; padding:0 24px 64px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.grid-item { aspect-ratio:1; display:grid; place-items:center; font-size:4rem; border-radius: 20px; cursor:pointer; border:none; }
.messages-wrap { max-width:640px; margin:0 auto; padding:48px 24px; }
.messages-title { font-family:var(--hand); font-size:3rem; }
.conversation { display:flex; align-items:center; gap:16px; padding:20px; cursor:pointer; border-bottom: 1px solid var(--line-2); }
.thread-wrap { max-width:640px; margin:0 auto; padding:32px 24px 120px; }
.thread-messages { min-height:300px; display: flex; flex-direction: column; gap: 16px; }
.message { max-width:75%; }
.message.mine { align-self: flex-end; }
.message-bubble { padding:14px 20px; background:var(--paper-2); border-radius: 20px 20px 20px 4px; }
.message.mine .message-bubble { background:var(--mint); color:#fff; border-radius: 20px 20px 4px 20px; }
.thread-form { display:flex; gap:12px; position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); width: min(640px, calc(100% - 48px)); background: var(--paper); padding: 12px; border-radius: 30px; box-shadow: 0 12px 40px rgba(0,0,0,0.1); }
.thread-form input { flex:1; padding:12px 20px; border-radius: 20px; border: 2px solid var(--line); }
.legal { max-width:640px; margin:0 auto; padding:64px 24px; }
.legal h1 { font-family:var(--hand); font-size:3.5rem; margin-bottom:16px; }
.back-link { display:inline-block; font-size:0.85rem; font-weight:600; color:var(--ink-3); margin-bottom:24px; cursor:pointer; background: var(--paper-2); padding: 8px 16px; border-radius: 20px; }
.empty { text-align:center; padding:100px 24px; }
.empty h3 { font-family:var(--hand); font-size:2.5rem; color:var(--mint-3); margin-bottom:12px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body data-view="welcome">

<div id="view-welcome">
  <div id="welcome-globe"></div>
  <div class="welcome-overlay"></div>
  <div class="welcome-content">
    <span class="welcome-kicker">Global Atlas</span>
    <h1 class="welcome-title">The World at<br>Your Fingertips</h1>
    <p class="welcome-sub">Explore the globe and discover the diversity of our planet. Share your culture, your stories, and your music with the world.</p>
    <button class="welcome-btn" data-action="enter-app">Enter the Atlas <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  </div>
</div>

<div id="app-root" hidden>
  <header id="nav">
    <a class="brand" data-view="feed">Culture of Humanity</a>
    <div id="nav-links"></div>
    <div id="nav-auth">
      <!-- Buttons are rendered dynamically via renderNav() -->
    </div>
  </header>

  <main id="main"></main>

  <div id="view-globe" hidden>
    <div id="globe-canvas"></div>
    <div id="globe-pins"></div>
    <div id="globe-overlay"></div>
    <div class="globe-instruction">Click anywhere on the globe to drop a pin</div>
  </div>

  <footer style="border-top: 2px dashed var(--line); padding: 40px; text-align: center; color: var(--ink-3);">
    <span style="font-family: var(--hand); font-size: 1.5rem; color: var(--mint-3); display: block; margin-bottom: 12px;">Culture of Humanity</span>
    <a data-view="privacy" style="margin: 0 12px; font-weight: 600;">Privacy Policy</a> · 
    <a data-view="terms" style="margin: 0 12px; font-weight: 600;">Terms &amp; Conditions</a>
  </footer>
</div>

<div id="modal-root"></div>
<div id="toast" style="position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:14px 28px;border-radius:30px;font-weight:600;z-index:200; box-shadow: 0 10px 30px rgba(0,0,0,0.2);" hidden></div>

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════════════════
   1. INITIALIZATION & SECURITY
   ═══════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://ydbhtlgxefapcjqurlpm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nVROPvNoluHIBrxwMcajSw_yNgnuNrM';

let supabase = null;
try {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch (e) {
  console.error("Supabase initialization failed:", e);
}

let db = { users: {}, posts: [], likes: [], comments: [], messages: [], follows: [] };
const state = { view: 'welcome', user: null, postId: null, profileUser: null, threadUser: null, authMode: 'signin' };

// Escape strings to prevent XSS attacks
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

// Utility: Toast notifications
let toastTimer;
function toast(msg) { 
  const el = document.getElementById('toast'); 
  el.textContent = msg; 
  el.hidden = false; 
  clearTimeout(toastTimer); 
  toastTimer = setTimeout(() => { el.hidden = true; }, 3500); 
}

// Utility: Time formatting
function timeAgo(t) { 
  const sec = Math.floor((Date.now() - new Date(t).getTime()) / 1000); 
  if (sec < 60) return 'just now'; 
  if (sec < 3600) return Math.floor(sec / 60) + 'm ago'; 
  return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); 
}

/* ═══════════════════════════════════════════════════════
   2. SUPABASE DATA FETCHING
   ═══════════════════════════════════════════════════════ */
async function loadData() {
  if (!supabase) return;
  try {
    const { data: profiles, error: pError } = await supabase.from('profiles').select('*');
    if (pError) throw pError;
    if (profiles) profiles.forEach(p => db.users[p.id] = p);

    const { data: posts, error: postError } = await supabase.from('posts').select('*, likes(post_id, user_id), comments(*)').order('created_at', { ascending: false });
    if (postError) throw postError;
    if (posts) db.posts = posts;

    const { data: follows, error: fError } = await supabase.from('follows').select('*');
    if (fError) throw fError;
    if (follows) db.follows = follows;

    if (state.user) {
      const { data: messages, error: mError } = await supabase.from('messages').select('*').or(`sender_id.eq.${state.user.id},receiver_id.eq.${state.user.id}`).order('created_at', { ascending: true });
      if (mError) throw mError;
      if (messages) db.messages = messages;
    }
  } catch (e) { 
    console.error("Data loading error:", e);
    toast("Failed to load data. Please refresh.");
  }
}

// Listen for auth changes
if (supabase) {
  supabase.auth.onAuthStateChange(async (event, session) => {
    state.user = session ? session.user : null;
    if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
      await loadData();
      render();
    }
  });
}

/* ═══════════════════════════════════════════════════════
   3. INITIALIZATION
   ═══════════════════════════════════════════════════════ */
async function init() {
  document.body.dataset.view = 'welcome';
  try { initWelcomeGlobe(); } catch(e) { console.error("Globe error:", e); }
  
  if (supabase) {
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        state.user = session.user;
        await loadData();
        render();
      }
    } catch (e) { console.error("Session check error:", e); }
  }
}

/* ═══════════════════════════════════════════════════════
   4. ROUTING & RENDERING
   ═══════════════════════════════════════════════════════ */
function go(view, params = {}) {
  if (params.postId !== undefined) state.postId = params.postId;
  if (params.profileUser !== undefined) state.profileUser = params.profileUser;
  if (params.threadUser !== undefined) state.threadUser = params.threadUser;
  
  state.view = view;
  document.body.dataset.view = view;
  
  const welcomeEl = document.getElementById('view-welcome');
  const appEl = document.getElementById('app-root');
  const globeEl = document.getElementById('view-globe');
  const mainEl = document.getElementById('main');

  if (view === 'welcome') {
    welcomeEl.hidden = false;
    appEl.hidden = true;
  } else {
    welcomeEl.hidden = true;
    appEl.hidden = false;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
    if (view === 'globe') {
      globeEl.hidden = false;
      mainEl.style.display = 'none';
      ensureAppGlobe();
    } else {
      globeEl.hidden = true;
      mainEl.style.display = 'block';
    }
  }
}

function render() {
  renderNav();
  if (state.view === 'globe') return; // Globe handles its own view

  const main = document.getElementById('main');
  try {
    if (state.view === 'feed') main.innerHTML = viewFeed();
    else if (state.view === 'post') main.innerHTML = viewPost();
    else if (state.view === 'profile') main.innerHTML = viewProfile();
    else if (state.view === 'messages') main.innerHTML = viewMessages();
    else if (state.view === 'thread') main.innerHTML = viewThread();
    else if (state.view === 'privacy' || state.view === 'terms') main.innerHTML = viewLegal(state.view);
  } catch (e) {
    console.error("Render error:", e);
    main.innerHTML = `<div class="empty"><h3>Something went wrong</h3><p>Could not render this page.</p></div>`;
  }
}

function renderNav() {
  const base = [{ view: 'feed', label: 'Feed' }, { view: 'globe', label: 'Globe' }];
  if (state.user) { base.push({ view: 'messages', label: 'Messages' }, { view: 'profile', label: 'Profile' }); }
  
  document.getElementById('nav-links').innerHTML = base.map(l => 
    `<a class="nav-link ${state.view === l.view ? 'active' : ''}" data-view="${l.view}">${l.label}</a>`
  ).join('');
  
  const authEl = document.getElementById('nav-auth');
  if (state.user) {
    const u = db.users[state.user.id] || { name: 'User', emoji: '🌿' };
    authEl.innerHTML = `
      <button class="btn ghost small" data-view="profile" style="gap:8px;">
        <span style="font-size:1.2rem;">${esc(u.emoji)}</span>
        <span style="font-weight:700;">${esc(u.name.split(' ')[0])}</span>
      </button>
      <button class="btn small" data-action="signout">Out</button>
    `;
  } else {
    authEl.innerHTML = `
      <button class="btn ghost small" data-action="open-auth" data-mode="signin">Sign in</button>
      <button class="btn primary small" data-action="open-auth" data-mode="signup">Join</button>
    `;
  }
}

/* ═══════════════════════════════════════════════════════
   5. VIEW TEMPLATES
   ═══════════════════════════════════════════════════════ */
function viewFeed() {
  if (!db.posts.length) {
    return `
      <div class="feed-header"><h1>A living atlas of culture</h1><p>Places, songs, food, and the people who carry them</p></div>
      <div class="feed-divider">✦ ✦ ✦</div>
      <div class="empty">
        <h3>The feed is quiet</h3>
        <p>Be the first to share a place, a song, or a memory.</p>
        ${state.user ? '<button class="btn primary" data-action="compose">Write the first post</button>' : '<button class="btn primary" data-action="open-auth" data-mode="signin">Sign in to post</button>'}
      </div>`;
  }
  return `
    <div class="feed-header"><h1>A living atlas of culture</h1><p>Places, songs, food, and the people who carry them</p></div>
    <div class="feed-divider">✦ ✦ ✦</div>

function viewMessages() {
  if (!state.user) return `<div class="empty"><h3>Sign in to see messages</h3></div>`;
  const threads = {};
  db.messages.forEach(m => { 
    const other = m.sender_id === state.user.id ? m.receiver_id : m.sender_id; 
    if (!threads[other] || new Date(m.created_at) > new Date(threads[other].created_at)) threads[other] = m; 
  });
  const entries = Object.entries(threads).sort((a,b) => new Date(b[1].created_at) - new Date(a[1].created_at));
  
  return `
    <div class="messages-wrap">
      <h1 class="messages-title">Messages</h1>
      ${entries.length ? entries.map(([other, last]) => `
        <div class="conversation" data-thread="${esc(other)}">
          <div class="avatar" style="width:48px;height:48px;">${esc(db.users[other]?.emoji || '?')}</div>
          <div style="flex:1;">
            <div style="font-weight:700;">${esc(db.users[other]?.name || 'Unknown')}</div>
            <div style="font-size:0.9rem;color:var(--ink-3);">${last.sender_id === state.user.id ? 'You: ' : ''}${esc(last.text)}</div>
          </div>
        </div>`).join('') : `<p>No messages yet.</p>`}
    </div>`;
}

function viewThread() {
  if (!state.user || !db.users[state.threadUser]) return `<div class="empty"><h3>Not found</h3></div>`;
  const other = state.threadUser;
  const msgs = db.messages.filter(m => (m.sender_id === state.user.id && m.receiver_id === other) || (m.sender_id === other && m.receiver_id === state.user.id));
  
  return `

async function handleAuthSubmit(e) {
  e.preventDefault();
  if (!supabase) { toast("Database not connected."); return; }
  
  const form = e.target;
  const btn = form.querySelector('button[type="submit"]');
  const errEl = form.querySelector('[data-auth-error]');
  const fd = new FormData(form);
  const email = fd.get('email').trim();
  const password = fd.get('password');

  // Basic validation
  if (password.length < 6) { errEl.textContent = "Password must be at least 6 characters."; return; }

  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Processing...';
  errEl.textContent = '';

  try {
    if (state.authMode === 'signin') {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      toast("Welcome back!");
    } else {
      const username = fd.get('username').trim();
      const name = fd.get('name').trim();
      if (!username || !name) throw new Error("Username and Display Name are required.");
      
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) throw error;
      
      if (data.user) {
        // Insert profile
        const { error: profileError } = await supabase.from('profiles').insert({
          id: data.user.id, 
          username: username, 
          name: name, 
          emoji: fd.get('emoji') || '🌿', 
          bio: fd.get('bio') || 'New to the atlas.'
        });
        
        if (profileError) {
          if (profileError.code === '23505') throw new Error("That username is already taken.");
          throw profileError;
        }
      }
      toast('Account created! You are now signed in.');
    }
    closeModal();
  } catch (err) {
    console.error(err);
    errEl.textContent = err.message || "An error occurred. Please try again.";
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

async function handleComposeSubmit(e) {
  e.preventDefault();
  if (!state.user || !supabase) return;
  
  const form = e.target;
  const btn = form.querySelector('button[type="submit"]');
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Publishing...';

  try {
    const fd = new FormData(form);
    const { error } = await supabase.from('posts').insert({ 
      author_id: state.user.id, 
      caption: fd.get('caption').trim(), 
      place: fd.get('place').trim(), 
      emoji: fd.get('emoji') || '✦', 
      theme: fd.get('theme') 
    });
    if (error) throw error;
    
    closeModal(); 
    await loadData(); 
    render(); 
    toast('Posted to the atlas');
  } catch (err) {
    toast("Failed to post: " + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

async function toggleLike(postId) { 
  if (!state.user || !supabase) return; 
  try {
    const post = db.posts.find(p => p.id === postId); 
    const existing = post.likes.find(l => l.user_id === state.user.id); 
    if (existing) {
      await supabase.from('likes').delete().match({ post_id: postId, user_id: state.user.id }); 
    } else {
      await supabase.from('likes').insert({ post_id: postId, user_id: state.user.id }); 
    }
    await loadData(); 
    render(); 
  } catch (e) { console.error(e); }
}

async function addComment(postId, text) { 
  if (!state.user || !text.trim() || !supabase) return; 
  try {
    await supabase.from('comments').insert({ post_id: postId, author_id: state.user.id, text: text.trim().slice(0, 300) }); 
    await loadData(); 
    render(); 
  } catch (e) { console.error(e); }
}

async function followUser(userId) { 
  if (!state.user || !supabase) return; 
  try {
    const exists = db.follows.find(f => f.follower_id === state.user.id && f.following_id === userId); 
    if (exists) {
      await supabase.from('follows').delete().match({ follower_id: state.user.id, following_id: userId }); 
    } else {
      await supabase.from('follows').insert({ follower_id: state.user.id, following_id: userId }); 
    }
    await loadData(); 
    render(); 
  } catch (e) { console.error(e); }
}

async function sendMessage(to, text) { 
  if (!state.user || !text.trim() || !supabase) return; 
  try {
    await supabase.from('messages').insert({ sender_id: state.user.id, receiver_id: to, text: text.trim() }); 
    await loadData(); 
    render(); 
  } catch (e) { console.error(e); }
}

async function signOut() { 
  if (supabase) await supabase.auth.signOut(); 
  state.user = null; 
  go('feed'); 
  toast('Signed out.'); 
}

/* ═══════════════════════════════════════════════════════
   8. GLOBAL EVENT DELEGATION (Fixes all click bugs)
   ═══════════════════════════════════════════════════════ */
document.addEventListener('click', (e) => {
  // 1. Close Modal ONLY if clicking directly on the backdrop
  if (e.target.classList.contains('modal-backdrop')) {
    closeModal();
    return;
  }
  
  // 2. Close Modal if clicking the X button
  if (e.target.closest('[data-close-modal]')) {
    closeModal();
    return;
  }

  // 3. Handle Auth Tab Switching inside modal
  const switchTab = e.target.closest('[data-switch-auth]');
  if (switchTab) {
    openAuthModal(switchTab.dataset.switchAuth);
    return;
  }

  // 4. Handle Actions (Join, Sign in, Compose, Enter app, etc)
  const actionEl = e.target.closest('[data-action]');
  if (actionEl) {
    const action = actionEl.dataset.action;
    if (action === 'enter-app') go('feed');
    else if (action === 'open-auth') openAuthModal(actionEl.dataset.mode || 'signin');
    else if (action === 'compose') openComposeModal();
    else if (action === 'signout') signOut();
    else if (action === 'like') toggleLike(actionEl.dataset.id);
    else if (action === 'follow') followUser(actionEl.dataset.user);
    else if (action === 'message-user') go('thread', { threadUser: actionEl.dataset.user });
    return;
  }

  // 5. Handle Routing (data-view)
  const viewEl = e.target.closest('[data-view]');
  if (viewEl) {
    const v = viewEl.dataset.view;
    if (v === 'profile') go('profile', { profileUser: state.user ? state.user.id : null });
    else go(v);
    return;
  }

  // 6. Handle clicking on profiles
  const profileEl = e.target.closest('[data-profile]');
  if (profileEl) {
    go('profile', { profileUser: profileEl.dataset.profile });
    return;
  }

  // 7. Handle opening posts
  const postEl = e.target.closest('[data-open-post]');
  if (postEl) {
    go('post', { postId: postEl.dataset.openPost });
    return;
  }

  // 8. Handle opening threads
  const threadEl = e.target.closest('[data-thread]');
  if (threadEl) {
    go('thread', { threadUser: threadEl.dataset.thread });
    return;
  }
});

// Handle all form submissions
document.addEventListener('submit', (e) => {
  if (e.target.closest('[data-auth-form]')) return handleAuthSubmit(e);
  if (e.target.closest('[data-compose-form]')) return handleComposeSubmit(e);
  
  const commentForm = e.target.closest('[data-comment-form]');
  if (commentForm) { 
    e.preventDefault(); 
    const input = commentForm.querySelector('input'); 
    addComment(commentForm.dataset.commentForm, input.value); 
    input.value = ''; 
    return;
  }
  
  const threadForm = e.target.closest('[data-thread-form]');
  if (threadForm) { 
    e.preventDefault(); 
    const input = threadForm.querySelector('input'); 
    sendMessage(threadForm.dataset.threadForm, input.value); 
    input.value = ''; 
    return;
  }
});

let globeCtx = null;
let welcomeCtx = null;
const GLOBE_RADIUS = 100;
const SUN_DIR = new THREE.Vector3(-5, 3, 5).normalize();
const TEX = { 
  day: 'https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/textures/planets/earth_day_4096.jpg', 
  night: 'https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/textures/planets/earth_night_4096.jpg',

  clouds: 'https://raw.githubusercontent.com/mrdoob/three.js/r150/examples/textures/planets/earth_clouds_2048.png' 
};

const earthVertex = `varying vec2 vUv; varying vec3 vNormal; varying vec3 vViewPosition; void main() { vUv = uv; vec4 mvPosition = modelViewMatrix * vec4(position, 1.0); vNormal = normalize(normalMatrix * normal); vViewPosition = -mvPosition.xyz; gl_Position = projectionMatrix * mvPosition; }`;
const earthFragment = `uniform sampler2D dayTexture; uniform sampler2D nightTexture; uniform sampler2D specularMap; uniform sampler2D normalMap; uniform vec3 sunDirection; varying vec2 vUv; varying vec3 vNormal; varying vec3 vViewPosition; mat3 cotangentFrame(vec3 N, vec3 p, vec2 uv) { vec3 dp1 = dFdx(p); vec3 dp2 = dFdy(p); vec2 duv1 = dFdx(uv); vec2 duv2 = dFdy(uv); vec3 dp2perp = cross(dp2, N); vec3 dp1perp = cross(N, dp1); vec3 T = dp2perp * duv1.x + dp1perp * duv2.x; vec3 B = dp2perp * duv1.y + dp1perp * duv2.y; float invmax = inversesqrt(max(dot(T,T), dot(B,B))); return mat3(T * invmax, B * invmax, N); } void main() { vec3 N = normalize(vNormal); vec3 V = normalize(vViewPosition); mat3 TBN = cotangentFrame(N, -vViewPosition, vUv); vec3 nTex = texture2D(normalMap, vUv).xyz * 2.0 - 1.0; vec3 normal = normalize(TBN * nTex); float sunDot = dot(normal, sunDirection); float dayAmount = smoothstep(-0.1, 0.1, sunDot); vec3 dayColor = texture2D(dayTexture, vUv).rgb; vec3 nightColor = texture2D(nightTexture, vUv).rgb; float specMask = texture2D(specularMap, vUv).r; vec3 H = normalize(sunDirection + V); float spec = pow(max(dot(normal, H), 0.0), 60.0) * specMask; vec3 color = mix(nightColor * 0.2, dayColor, dayAmount); color += vec3(1.0, 0.95, 0.9) * spec * 1.2; gl_FragColor = vec4(color, 1.0); }`;

function initWelcomeGlobe() {
  const container = document.getElementById('welcome-globe'); 
  if (!container) return;
  
  const scene = new THREE.Scene(); 
  scene.background = new THREE.Color(0x000000);
  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 20000); 
  camera.position.set(-130, 30, 260); 
  camera.lookAt(40, 0, 0); 
  
  const renderer = new THREE.WebGLRenderer({ antialias: true }); 
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
  renderer.setSize(window.innerWidth, window.innerHeight); 
  renderer.outputColorSpace = THREE.SRGBColorSpace; 
  renderer.toneMapping = THREE.ACESFilmicToneMapping; 
  renderer.toneMappingExposure = 1.2; 
  container.appendChild(renderer.domElement);
  
  scene.add(new THREE.AmbientLight(0xffffff, 0.15)); 
  const sunLight = new THREE.DirectionalLight(0xffffff, 2.0); 
  sunLight.position.copy(SUN_DIR).multiplyScalar(1000); 
  scene.add(sunLight);
  
  const earth = new THREE.Mesh(new THREE.SphereGeometry(GLOBE_RADIUS, 128, 128), new THREE.MeshPhongMaterial({ color: 0x223344 })); 
  scene.add(earth);
  
  const cloudMat = new THREE.MeshPhongMaterial({ transparent: true, opacity: 0.7, depthWrite: false }); 
  const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(GLOBE_RADIUS * 1.005, 96, 96), cloudMat); 
  scene.add(cloudMesh);
  
  const atmGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 1.04, 96, 96); 
  const atmMat = new THREE.MeshBasicMaterial({ color: 0x3d7fd6, transparent: true, opacity: 0.15, side: THREE.BackSide }); 
  const atmosphere = new THREE.Mesh(atmGeo, atmMat); 
  scene.add(atmosphere);
  
  const loader = new THREE.TextureLoader(); 
  loader.setCrossOrigin('anonymous'); 
  const textures = {}; 
  let loaded = 0;
  
  const onLoad = () => { 
    loaded++; 
    if (loaded === 4) { 
      earth.material = new THREE.ShaderMaterial({ 
        uniforms: { 
          dayTexture: { value: textures.day }, 
          nightTexture: { value: textures.night }, 
          specularMap: { value: textures.spec }, 
          normalMap: { value: textures.normal }, 
          sunDirection: { value: SUN_DIR.clone() } 
        }, 
        vertexShader: earthVertex, 
        fragmentShader: earthFragment 
      }); 
    } 
  };
  
  loader.load(TEX.day, t => { textures.day = t; onLoad(); }); 
  loader.load(TEX.night, t => { textures.night = t; onLoad(); }); 
  loader.load(TEX.spec, t => { textures.spec = t; onLoad(); }); 
  loader.load(TEX.normal, t => { textures.normal = t; onLoad(); }); 
  loader.load(TEX.clouds, t => { cloudMat.map = t; cloudMat.needsUpdate = true; });
  
  let last = performance.now();
  (function loop() { 
    const now = performance.now(); 
    const dt = Math.min(0.1, (now - last) / 1000); 
    last = now; 
    if (state.view === 'welcome') { 
      earth.rotation.y += dt * 0.01; 
      cloudMesh.rotation.y += dt * 0.015; 
      renderer.render(scene, camera); 
    } 
    requestAnimationFrame(loop); 
  })();
}

function ensureAppGlobe() {
  if (globeCtx) return;
  const container = document.getElementById('globe-canvas'); 
  if (!container) return;
  
  const scene = new THREE.Scene(); 
  scene.background = new THREE.Color(0x000000);
  const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 20000); 
  camera.position.set(0, 30, 320);
  
  const renderer = new THREE.WebGLRenderer({ antialias: true }); 
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
  renderer.setSize(container.clientWidth, container.clientHeight); 
  renderer.outputColorSpace = THREE.SRGBColorSpace; 
  renderer.toneMapping = THREE.ACESFilmicToneMapping; 
  container.appendChild(renderer.domElement);
  
  const controls = new OrbitControls(camera, renderer.domElement); 
  controls.enableDamping = true; 
  controls.dampingFactor = 0.06; 
  controls.autoRotate = true; 
  controls.autoRotateSpeed = 0.2;
  
  scene.add(new THREE.AmbientLight(0x111122, 0.6)); 
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.5); 
  sunLight.position.copy(SUN_DIR).multiplyScalar(1000); 
  scene.add(sunLight);
  
  const earthUniforms = { dayTexture: { value: null }, nightTexture: { value: null }, specularMap: { value: null }, normalMap: { value: null }, sunDirection: { value: SUN_DIR.clone() } };
  const earth = new THREE.Mesh(new THREE.SphereGeometry(GLOBE_RADIUS, 128, 128), new THREE.ShaderMaterial({ uniforms: earthUniforms, vertexShader: earthVertex, fragmentShader: earthFragment })); 
  scene.add(earth);
  
  const cloudMat = new THREE.MeshPhongMaterial({ transparent: true, opacity: 0.8, depthWrite: false }); 
  const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(GLOBE_RADIUS * 1.005, 96, 96), cloudMat); 
  scene.add(cloudMesh);
  
  const loader = new THREE.TextureLoader(); 
  loader.setCrossOrigin('anonymous');
  
  Promise.all([ 
    new Promise(res => loader.load(TEX.day, t => { earthUniforms.dayTexture.value = t; res(); })), 
    new Promise(res => loader.load(TEX.night, t => { earthUniforms.nightTexture.value = t; res(); })), 
    new Promise(res => loader.load(TEX.spec, t => { earthUniforms.specularMap.value = t; res(); })), 
    new Promise(res => loader.load(TEX.normal, t => { earthUniforms.normalMap.value = t; res(); })), 
    new Promise(res => loader.load(TEX.clouds, t => { cloudMat.map = t; cloudMat.needsUpdate = true; res(); })) 
  ]);
  
  globeCtx = { scene, camera, renderer, controls, earth, cloudMesh, pins: [] };
  
  const raycaster = new THREE.Raycaster(); 
  const mouse = new THREE.Vector2();
  
  renderer.domElement.addEventListener('pointerdown', (e) => { 
    if (e.button !== 0) return; 
    const startX = e.clientX; 
    const startY = e.clientY; 
    const startTime = performance.now(); 
    
    const onUp = (upEvent) => { 
      if (Math.hypot(upEvent.clientX - startX, upEvent.clientY - startY) < 5 && performance.now() - startTime < 300) { 
        const rect = renderer.domElement.getBoundingClientRect(); 
        mouse.x = ((upEvent.clientX - rect.left) / rect.width) * 2 - 1; 
        mouse.y = -((upEvent.clientY - rect.top) / rect.height) * 2 + 1; 
        raycaster.setFromCamera(mouse, camera); 
        const intersects = raycaster.intersectObject(earth); 
        if (intersects.length > 0) { 
          const p = intersects[0].point; 
          const r = p.length(); 
          const lat = 90 - (Math.acos(p.y / r) * 180 / Math.PI); 
          let lng = (Math.atan2(p.z, -p.x) * 180 / Math.PI) - 180; 
          if (lng < -180) lng += 360; 
          if (lng > 180) lng -= 360; 
          if (!state.user) { toast('Sign in to drop a pin'); openAuthModal('signin'); return; }
          openComposeModal(); 
        } 
      } 
      renderer.domElement.removeEventListener('pointerup', onUp); 
    }; 
    renderer.domElement.addEventListener('pointerup', onUp); 
  });
  
  window.addEventListener('resize', () => { 
    const w = container.clientWidth; 
    const h = container.clientHeight; 
    camera.aspect = w / h; 
    camera.updateProjectionMatrix(); 
    renderer.setSize(w, h); 
  });
  
  (function loop() { 
    if (document.body.dataset.view === 'globe') { 
      const dt = 0.016; 
      if (globeCtx.earth) globeCtx.earth.rotation.y += dt * 0.003; 
      if (globeCtx.cloudMesh) globeCtx.cloudMesh.rotation.y += dt * 0.004; 
      globeCtx.controls.update(); 
      updateGlobePinPositions(); 
      globeCtx.renderer.render(globeCtx.scene, globeCtx.camera); 
    } 
    requestAnimationFrame(loop); 
  })();
}

function renderGlobePins() { 
  if (!globeCtx) return; 
  const wrap = document.getElementById('globe-pins'); 
  wrap.innerHTML = ''; 
  globeCtx.pins = []; 
  db.posts.forEach(post => { 
    const pos = latLngToVec3(35, 135, GLOBE_RADIUS * 1.01); // Default to Japan
    const el = document.createElement('div'); 
    el.className = 'globe-pin'; 
    el.innerHTML = `<div class="globe-pin-dot"></div><div class="globe-pin-label">${esc(post.place)}</div>`; 
    el.querySelector('.globe-pin-dot').addEventListener('click', () => go('post', { postId: post.id })); 
    wrap.appendChild(el); 
    globeCtx.pins.push({ el, pos }); 
  }); 
  updateGlobePinPositions(); 
}

function latLngToVec3(lat, lng, r = GLOBE_RADIUS) { 
  const phi = (90 - lat) * Math.PI / 180; 
  const theta = (lng + 180) * Math.PI / 180; 
  return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta)); 
}

function updateGlobePinPositions() { 
  if (!globeCtx) return; 
  const v = new THREE.Vector3(); 
  globeCtx.pins.forEach(({ el, pos }) => { 
    const rotated = pos.clone().applyEuler(globeCtx.earth.rotation); 
    if (rotated.clone().normalize().dot(globeCtx.camera.position.clone().sub(rotated).normalize()) < -0.05) { 
      el.style.display = 'none'; 
      return; 
    } 
    v.copy(rotated).project(globeCtx.camera); 
    el.style.display = ''; 
    el.style.transform = `translate3d(${(v.x * 0.5 + 0.5) * globeCtx.renderer.domElement.clientWidth}px, ${(-v.y * 0.5 + 0.5) * globeCtx.renderer.domElement.clientHeight}px, 0)`; 
  }); 
}

// Make sure the globe pins render when the view loads
const originalGo = go;
go = function(view, params) {
  originalGo(view, params);
  if (view === 'globe') setTimeout(renderGlobePins, 100);
};

init();
</script>
