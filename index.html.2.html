<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Culture of Humanity</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #fbf8f1; --paper-2: #f2ebd9; --card: #ffffff;
    --ink: #2c2a26; --ink-2: #545049; --ink-3: #8c857a; --ink-4: #b8b2a6;
    --mint: #397c5d; --mint-2: #5aab81; --mint-3: #224d39; --mint-bg: #e3f0e9;
    --red: #c45a4d; --line: #eae2d1; --line-2: #f4efe5;
    --hand: 'Caveat', cursive; --round: 'Quicksand', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body { font-family: var(--round); font-size: 15px; line-height: 1.6; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button { font-family: inherit; background: none; border: none; cursor: pointer; color: inherit; padding: 0; transition: all 0.2s ease; }
  a { color: inherit; text-decoration: none; cursor: pointer; }
  input, textarea, select { font-family: inherit; color: inherit; }

  /* Welcome View */
  #view-welcome { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: center; color: #fff; overflow: hidden; background: #000; }
  #welcome-globe { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  #welcome-globe canvas { display: block; }
  .welcome-overlay { position: absolute; inset: 0; z-index: 2; background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 45%, transparent 75%); pointer-events: none; }
  .welcome-content { position: relative; z-index: 3; padding: 0 8vw; max-width: 800px; animation: fadeIn 1.5s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .welcome-kicker { font-size: 0.8rem; letter-spacing: 0.25em; text-transform: uppercase; font-weight: 600; color: var(--mint-2); margin-bottom: 24px; display: block; }
  .welcome-title { font-family: var(--hand); font-weight: 600; font-size: clamp(4rem, 8vw, 7rem); line-height: 0.95; margin-bottom: 24px; color: #fff; }
  .welcome-sub { font-size: clamp(1.1rem, 1.4vw, 1.3rem); line-height: 1.6; color: rgba(235, 245, 240, 0.85); max-width: 480px; margin-bottom: 48px; }
  .welcome-btn { display: inline-flex; align-items: center; gap: 12px; padding: 16px 36px; border: 2px solid rgba(90,171,129,0.6); border-radius: 30px; background: rgba(57,124,93,0.2); backdrop-filter: blur(8px); font-size: 0.9rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--mint-2); pointer-events: auto; }
  
  /* Nav */
  #nav { position: sticky; top: 0; z-index: 40; background: rgba(251,248,241,0.9); backdrop-filter: blur(12px); border-bottom: 2px dashed var(--line); height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
  .brand { font-family: var(--hand); font-weight: 700; font-size: 2rem; color: var(--mint-3); }
  #nav-links { display: flex; gap: 8px; }
  .nav-link { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--ink-3); padding: 10px 18px; border-radius: 20px; }
  .nav-link.active { color: var(--mint-3); background: var(--mint-bg); }
  #nav-auth { display: flex; gap: 8px; align-items: center; }

  /* UI Elements */
  .btn { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding: 12px 24px; border-radius: 24px; background: var(--card); color: var(--ink); border: 2px solid var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--mint); color: #fff; border-color: var(--mint); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.small { padding: 8px 16px; font-size: 0.7rem; }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }

  #main { padding-bottom: 80px; }
  .feed-header { text-align: center; padding: 56px 20px 24px; }
  .feed-header h1 { font-family: var(--hand); font-size: 3.2rem; }
  .feed-divider { text-align: center; color: var(--mint-2); letter-spacing: 0.5em; padding-bottom: 32px; }
  .empty { text-align: center; padding: 80px 24px; }
  .empty h3 { font-family: var(--hand); font-size: 2.5rem; color: var(--mint-3); margin-bottom: 12px; }
  
  .post { background: var(--card); border-radius: 20px; border: 1px solid var(--line); margin: 0 auto 32px; max-width: 580px; overflow: hidden; }
  .post-head { padding: 16px 20px; display: flex; align-items: center; gap: 14px; }
  .avatar { width: 42px; height: 42px; border-radius: 16px; display: grid; place-items: center; background: var(--mint-bg); border: 2px solid #fff; font-size: 1.3rem; }
  .post-place { margin-left: auto; font-size: 0.65rem; font-weight: 600; color: var(--mint); background: var(--mint-bg); padding: 6px 12px; border-radius: 20px; }
  .post-scene { aspect-ratio: 1; display: grid; place-items: center; font-size: 6rem; background: var(--paper-2); }
  .post-body { padding: 20px; }

  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(44,42,38,0.6); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 100; padding: 20px; }
  .modal { background: var(--paper); border-radius: 24px; padding: 32px; max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; animation: modalIn 0.3s ease; }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.98); } }
  .modal-close { position: absolute; top: 16px; right: 16px; font-size: 1.5rem; color: var(--ink-3); cursor: pointer; }
  .modal h2 { font-family: var(--hand); font-size: 2.4rem; color: var(--mint-3); margin-bottom: 20px; }
  .modal label { display: block; font-size: 0.75rem; font-weight: 600; margin: 16px 0 8px; }
  .modal input, .modal textarea { width: 100%; padding: 14px; border: 2px solid var(--line); border-radius: 16px; font-size: 1rem; }
  .modal input:focus { outline: none; border-color: var(--mint-2); }
  .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
  .modal-actions .btn { flex: 1; }
  .modal-error { color: var(--red); font-size: 0.85rem; margin-top: 12px; font-weight: 600; min-height: 1.2em; }
  
  .btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px; background: #fff; color: #3c4043; border: 1px solid #dadce0; padding: 12px; border-radius: 24px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
  .btn-google:hover { background: #f8f9fa; }
  
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body data-view="welcome">

<div id="view-welcome">
  <div id="welcome-globe"></div>
  <div class="welcome-overlay"></div>
  <div class="welcome-content">
    <span class="welcome-kicker">Global Atlas</span>
    <h1 class="welcome-title">The World at<br>Your Fingertips</h1>
    <p class="welcome-sub">Explore the globe and discover the diversity of our planet. Share your culture, your stories, and your music with the world.</p>
    <button class="welcome-btn" id="btn-enter">Enter the Atlas <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  </div>
</div>

<div id="app-root" hidden>
  <header id="nav">
    <a class="brand" data-view="feed">Culture of Humanity</a>
    <div id="nav-links"></div>
    <div id="nav-auth"></div>
  </header>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast" style="position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:14px 28px;border-radius:30px;font-weight:600;z-index:200;" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
const SUPABASE_URL = 'https://ydbhtlgxefapcjqurlpm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nVROPvNoluHIBrxwMcajSw_yNgnuNrM';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let db = { users: {}, posts: [] };
let currentUser = null;
let currentAuthMode = 'signin';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  setTimeout(() => { el.hidden = true; }, 3000);
}

// 1. Google OAuth Login Logic
async function loginWithGoogle() {
  const errEl = document.getElementById('auth-error');
  try {
    errEl.textContent = "Connecting to Google...";
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin }
    });
    if (error) throw error;
  } catch (err) {
    console.error(err);
    errEl.textContent = "Google Login is not set up yet in Supabase.";
  }
}

// 2. Email/Password Auth Logic
async function submitAuth() {
  const errEl = document.getElementById('auth-error');
  const submitBtn = document.getElementById('auth-submit-btn');
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  
  if (!email || !password) { errEl.textContent = "Please fill in all fields."; return; }

  const originalText = submitBtn.innerHTML;
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span>Processing...';
  errEl.textContent = '';

  try {
    if (currentAuthMode === 'signin') {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      toast("Welcome back!");
      closeModal();
    } else {
      const username = document.getElementById('auth-username').value.trim();
      const name = document.getElementById('auth-name').value.trim();
      if (!username || !name) throw new Error("Username and Display Name are required.");

      const { data: authData, error: authError } = await supabase.auth.signUp({ email, password });
      
      if (authError) {
        if (authError.message.includes('rate limit')) {
          throw new Error("Email limit reached. Please use a different email or try Google Login.");
        }
        throw authError;
      }

      if (authData.user) {
        const { error: profileError } = await supabase.from('profiles').insert({
          id: authData.user.id,
          username: username,
          name: name,
          emoji: document.getElementById('auth-emoji')?.value || '🌿',
          bio: document.getElementById('auth-bio')?.value || 'New to the atlas.'
        });
        
        if (profileError) {
          if (profileError.code === '23505') throw new Error("That username is already taken.");
          throw profileError;
        }
      }
      toast("Account created successfully!");
      closeModal();
    }
  } catch (err) {
    console.error(err);
    errEl.textContent = err.message || "An error occurred during authentication.";
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = originalText;
  }
}

// 3. Modal Generation
function openAuthModal(mode) {
  currentAuthMode = mode || 'signin';
  const isSignIn = currentAuthMode === 'signin';
  
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target === this) window.closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="window.closeModal()">×</button>
        <h2>${isSignIn ? 'Welcome back' : 'Join the atlas'}</h2>
        
        <button class="btn-google" onclick="window.loginWithGoogle()">
          <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
        
        <div style="display:flex; align-items:center; text-align:center; color:var(--ink-4); font-size:0.8rem; margin: 20px 0;">
          <div style="flex:1; border-bottom:1px solid var(--line);"></div>
          <span style="padding:0 10px;">or use email</span>
          <div style="flex:1; border-bottom:1px solid var(--line);"></div>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:20px;">
          <button class="btn ${isSignIn ? 'primary' : 'ghost'}" style="flex:1;" onclick="window.switchAuth('signin')">Sign in</button>
          <button class="btn ${isSignIn ? 'ghost' : 'primary'}" style="flex:1;" onclick="window.switchAuth('signup')">Create account</button>
        </div>
        
        ${!isSignIn ? `
          <label>Username</label>
          <input id="auth-username" maxlength="20" placeholder="e.g. wanderer" />
          <label>Display name</label>
          <input id="auth-name" maxlength="40" placeholder="e.g. Alex Smith" />
          <label>Profile emoji</label>
          <input id="auth-emoji" maxlength="4" value="🌿" />
          <label>Short bio</label>
          <textarea id="auth-bio" maxlength="160" rows="2" placeholder="One line about you"></textarea>
        ` : ''}
        
        <label>Email</label>
        <input id="auth-email" type="email" placeholder="you@example.com" />
        <label>Password</label>
        <input id="auth-password" type="password" placeholder="At least 6 characters" />
        
        <p class="modal-error" id="auth-error"></p>
        
        <div class="modal-actions">
          <button class="btn ghost" onclick="window.closeModal()">Cancel</button>
          <button class="btn primary" id="auth-submit-btn" onclick="window.submitAuth()">${isSignIn ? 'Sign in' : 'Create account'}</button>
        </div>
      </div>
    </div>
  `;
}

window.openAuthModal = openAuthModal;
window.submitAuth = submitAuth;
window.switchAuth = (mode) => openAuthModal(mode);
window.closeModal = () => document.getElementById('modal-root').innerHTML = '';
window.loginWithGoogle = loginWithGoogle;

// 4. App Boot & Routing
document.getElementById('btn-enter').addEventListener('click', () => {
  document.getElementById('view-welcome').hidden = true;
  document.getElementById('app-root').hidden = false;
  renderApp();
});

async function renderApp() {
  try {
    const { data: profiles } = await supabase.from('profiles').select('*');
    if (profiles) profiles.forEach(p => db.users[p.id] = p);
    const { data: posts } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
    if (posts) db.posts = posts;
  } catch (e) { console.error(e); }

  const { data: { session } } = await supabase.auth.getSession();
  currentUser = session ? session.user : null;

  const authEl = document.getElementById('nav-auth');
  if (currentUser) {
    const u = db.users[currentUser.id] || { name: 'User', emoji: '🌿' };
    authEl.innerHTML = `
      <button class="btn ghost small" style="gap:8px;">
        <span style="font-size:1.2rem;">${esc(u.emoji)}</span>
        <span>${esc(u.name.split(' ')[0])}</span>
      </button>
      <button class="btn small" onclick="window.signOut()">Out</button>
    `;
  } else {
    authEl.innerHTML = `
      <button class="btn ghost small" onclick="window.openAuthModal('signin')">Sign in</button>
      <button class="btn primary small" onclick="window.openAuthModal('signup')">Join</button>
    `;
  }

  const main = document.getElementById('main');
  if (db.posts.length === 0) {
    main.innerHTML = `
      <div class="feed-header"><h1>A living atlas of culture</h1><p>Places, songs, food, and the people who carry them</p></div>
      <div class="feed-divider">✦ ✦ ✦</div>
      <div class="empty"><h3>The feed is quiet</h3><p>Be the first to share a place.</p></div>
    `;
  } else {
    main.innerHTML = `
      <div class="feed-header"><h1>A living atlas of culture</h1></div>
      <div class="feed-divider">✦ ✦ ✦</div>
      ${db.posts.map(post => {
        const author = db.users[post.author_id] || { name: 'Unknown', emoji: '?' };
        return `
          <article class="post">
            <header class="post-head">
              <div class="avatar">${esc(author.emoji)}</div>
              <div><div style="font-weight:700;">${esc(author.name)}</div></div>
              <div class="post-place">${esc(post.place)}</div>
            </header>
            <div class="post-scene">${esc(post.emoji)}</div>
            <div class="post-body"><p>${esc(post.caption)}</p></div>
          </article>
        `;
      }).join('')}
    `;
  }
}

window.signOut = async () => {
  await supabase.auth.signOut();
  renderApp();
  toast('Signed out.');
};
</script>
</body>
</html>
